<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarLens - Paper Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Add html2pdf.js for direct PDF downloading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Add KaTeX CSS and JS for math formula rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    
    <!-- Add Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    },
                    typography: {
                        DEFAULT: {
                            css: {
                                maxWidth: 'none',
                                color: '#333',
                                a: {
                                    color: '#3182ce',
                                    '&:hover': {
                                        color: '#2c5282',
                                    },
                                },
                            },
                        },
                    },
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        /* Basic markdown styling */
        .markdown-body h1 { font-size: 2em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
        .markdown-body h2 { font-size: 1.5em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
        .markdown-body h3 { font-size: 1.25em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; }
        .markdown-body p { margin-top: 0; margin-bottom: 16px; line-height: 1.6; }
        .markdown-body ul { padding-left: 2em; margin-bottom: 16px; list-style-type: disc; }
        .markdown-body ol { padding-left: 2em; margin-bottom: 16px; list-style-type: decimal; }
        .markdown-body li { margin-top: 0.25em; }
        .markdown-body strong { font-weight: 600; }
        .markdown-body em { font-style: italic; }
        .markdown-body blockquote { padding: 0 1em; color: #6a737d; border-left: 0.25em solid #dfe2e5; margin-bottom: 16px; }
        .markdown-body code { padding: 0.2em 0.4em; margin: 0; font-size: 85%; background-color: rgba(27,31,35,0.05); border-radius: 3px; font-family: monospace; }
        .markdown-body pre { padding: 16px; overflow: auto; font-size: 85%; line-height: 1.45; background-color: #f6f8fa; border-radius: 3px; margin-bottom: 16px; }
        .markdown-body pre code { background-color: transparent; padding: 0; }
        
        /* Table styling */
        .markdown-body table { border-collapse: collapse; width: 100%; margin-bottom: 16px; font-size: 0.9em; }
        .markdown-body table th, .markdown-body table td { border: 1px solid #dfe2e5; padding: 8px 13px; }
        .markdown-body table tr:nth-child(2n) { background-color: #f8fafc; }
        .markdown-body table th { font-weight: 600; background-color: #f1f5f9; text-align: left; }

        /* Print styles for PDF export - Fixes pagination cut-offs */
        @media print {
            @page {
                margin: 20mm;
            }
            body {
                background-color: white !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                height: auto !important;
                overflow: visible !important;
            }
            #root {
                height: auto !important;
                overflow: visible !important;
            }
            .markdown-body {
                color: black !important;
            }
            .markdown-body pre {
                border: 1px solid #ddd;
                white-space: pre-wrap;
                word-wrap: break-word;
            }
            /* Prevent page breaks inside elements */
            .markdown-body p, 
            .markdown-body li, 
            .markdown-body tr, 
            .markdown-body pre, 
            .markdown-body blockquote,
            .markdown-body img {
                page-break-inside: avoid;
                break-inside: avoid;
            }
            /* Prevent page breaks right after headings */
            .markdown-body h1, 
            .markdown-body h2, 
            .markdown-body h3, 
            .markdown-body h4 {
                page-break-after: avoid;
                break-after: avoid;
            }
        }
    </style>
    </head>
<body class="bg-slate-50 text-slate-900 h-screen overflow-hidden flex flex-col print:h-auto print:overflow-visible">
    <div id="root" class="h-full flex flex-col print:h-auto print:block"></div>
    <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.js"></script></body>
</html>
